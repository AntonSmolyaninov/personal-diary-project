{% extends 'base.html' %}

{% block title %}{{ entry.title }}{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header">
        <h2>{{ entry.title }}</h2>
        <small class="text-muted">
            Создано: {{ entry.created_at|date:"d.m.Y H:i" }} |
            Обновлено: {{ entry.updated_at|date:"d.m.Y H:i" }}
        </small>
    </div>
    <div class="card-body">
        <p style="white-space: pre-line;">{{ entry.content }}</p>
    </div>
    <div class="card-footer">
        <a href="{% url 'entry_list' %}" class="btn btn-secondary">← Назад</a>
        <a href="{% url 'entry_update' entry.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'entry_delete' entry.pk %}" class="btn btn-danger">Удалить</a>
    </div>
</div>
{% endblock %}
